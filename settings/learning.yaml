training:
  seed: null
  use_cuda: true
  gpu_id: 0
  distributed_training: true
  num_epochs: 1
  num_train_epochs: 20
  num_workers: 4
  batch_size: 32
  log_interval: 1
  save_interval: 50
  save_checkpoint_history: false
  eval_interval: 10
  learning_rate: 0.001  # only for non-rl training
  model_dir_name: models
  weight_decay: 0.00001
  if_use_random_training_seed: true
  # MCTS/AlphaZero specific settings
  max_training_steps: 8000  # Total training steps before termination
  min_buffer_size: 50       # Minimum replay buffer size to start training
  num_train_steps_per_epoch: 20  # Training steps per batch
  max_empty_batches: 50     # Stop if no data for N consecutive attempts
  # MCTS parameters for AlphaZero (OPTIMIZED FOR SPEED)
  computation_budget: 5     # Reduced from 20 for 4x speedup 
  c_puct: 1.0               # Lower exploration keeps visits less diffuse
  dirichlet_alpha: 0.03     # C++ root-noise alpha (<=0 falls back to dynamic alpha)
  dirichlet_epsilon: 0.10   # Mix less root noise into NN priors
  top_k_candidates: 24      # 0 disables prior-ranked candidate truncation in pure_cpp search
  # Learning parameters
  policy_learning_rate: 1e-4  # Learning rate for policy network
  replay_buffer_max_size: 500000  # Maximum number of episodes to keep in replay buffer
  replay_sample_accepted_ratio: 0.50   # Prefer successful prefixes in learner batches
  replay_sample_reject_tail_ratio: 0.25  # Keep some near-terminal failures for contrast
  replay_reject_tail_k: 2
  replay_recent_fraction: 0.75  # Heavily bias learner batches toward recent self-play
  replay_recent_window_size: 25000
  # Model loading options
  resume_training: true     # If true, load policy_latest.pt if it exists
  alphazero_model_path: ""  # Specific path to load AlphaZero weights (overrides resume_training)
  alpha_zero_backbone: gcn  # gcn | transformer
  # GPU batching optimizations
  use_batched_gpu: true     # Use batched GPU worker for MCTS evaluation
  gpu_batch_size: 32        # Batch size for GPU worker
  gpu_timeout_ms: 10        # Timeout for collecting batch requests
  disable_trajectory_writing: false  # Disable JSON writing for max speed (training only)
  # NN usage / ablations
  use_nn_policy: true
  use_nn_value: true
  uniform_prior: false
  value_normalization: tanh  # acceptance_first | sign | tanh | raw
  value_target_mode: tanh
  value_target_reject: -1.0
  value_target_accept_min: 0.2
  value_target_accept_max: 1.0
  value_scale: 1000.0
  transition_buffer_max_size: 50000  # Keep AlphaZero replay fresher in memory
  # Temperature annealing for MCTS action selection
  temperature_start: 1.0        # Initial temperature (exploration)
  temperature_end: 0.0          # Final temperature (greedy late training)
  temperature_anneal_steps: 5000  # Reach greedy behavior earlier in training
  temperature_move_threshold: 2   # After this many placements, use the post-threshold temperature
  temperature_after_threshold: 0.0
  replay_policy_temperature: 0.67  # Sharpen replay pi from visit counts before training
  # Execution mode toggles
  inference_only: false        # Skip learner/training loop and run inference-only
  enable_async_learner: true   # Disable to prevent spawning background learner
  # Learner control
  guaranteed_save_step: 50
  learner_throttle_ms: 0
  signal_stop_event_on_learner_complete: true  # Keep this enabled: once the learner stops updating weights, actors should stop too.
  # C++ MCTS implementation toggle
  use_cpp_mcts: true        # Use C++ implementation for MCTS (much faster)
  use_neural_network: true  # Enable neural network usage
  pure_cpp: false           # Skip Python reconstruction in full C++ solve path

inference:
  decode_strategy: greedy
  k_searching: 1
nn:
  hidden_dim: 128            # Reduced from 128 for speed  
  num_layers: 1             # Not used in alphazero nets
  dropout_prob: 0.0
  batch_norm: false
  # AlphaZero-specific model size optimizations
  num_gnn_layers: 3         
  embedding_dim: 128         
  n_heads: 8               
  transformer_layers: 4     

rl:
  gamma: 0.99
  target_steps: 256
  if_use_negative_sample: true
  if_use_baseline_solver: false
  if_allow_baseline_unsafe_solve: false
  reward_calculator:
    name: "fixed_intermediate" # options: ["fixed_intermediate", "fixed_final", "dynamic_intermediate", "dynamic_final"]
    intermediate_reward: 0.1
  # feature constructor
  feature_constructor:
    name: "p_net_v_node"
    extracted_attr_types: ["resource"]
    if_use_node_status_flags: true
    if_use_aggregated_link_attrs: true
    if_use_degree_metric: true
    if_use_more_topological_metrics: true
  # learning rate
  learning_rate:
    actor: 0.001
    critic: 0.001
    encoder: 0.001          # for sequence-to-sequence
    cost_critic: 0.001      # for safe RL
    lambda_net: 0.001       # for safe RL
    penalty_params: 0.0001  # for safe RL
  # loss coefficient
  coef_critic_loss: 0.5
  coef_entropy_loss: 0.01
  coef_mask_loss: 0.01
  l2reg_rate: 0.00025
  # tricks
  mask_actions: true
  maskable_policy: true
  clip_grad: true
  max_grad_norm: 0.5
  norm_critic_loss: false
  weight_decay: 0.00001
  norm_reward: false
  # PPO
  norm_advantage: true
  eps_clip: 0.2
  target_kl: null
  gae_lambda: 0.98
  repeat_times: 10
  # DQN
  explore_rate: 0.9
  # Safe RL
  safe_rl:
    srl_cost_budget: 0.2
    srl_alpha: 1.0
    srl_beta: 0.1
